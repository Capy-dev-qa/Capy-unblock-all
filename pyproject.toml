[project]
name = "torification"
version = "0.1.0"
description = "Browser-agnostic adaptive Tor routing: TCP probes, bridge races, ML block detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "joblib>=1.3"]
dev = ["pytest>=7.0"]

[project.scripts]
torification = "torification.cli:main"
torificationd = "torification.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
